[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = true
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./test/fixtures" },
]
gas_reports = ["ZKVerifierRegistry", "ProofGatekeeper", "GatedApp", "VerifierPoseidonPreimageAdapter"]
fuzz = { runs = 256, max_test_rejects = 65536, seed = "0x7a3f" }

[fmt]
line_length = 100
tab_width = 4

[invariant]
runs = 64
depth = 64
fail_on_revert = false