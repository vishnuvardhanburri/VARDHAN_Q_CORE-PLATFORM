# Secret scan — hard gate: fails the job only when gitleaks reports findings.
#
# Range resolution is owned by scripts/scan-range.mjs (released 2026-08-09).
# Background: the previous gitleaks-action invocation emitted an invalid
# revision range (`root_commit^..HEAD`) on the first push, and the action's
# range failing is exactly what broke the run. The resolver here never emits
# an invalid range — unresolvable inputs degrade to a full-history scan — so
# the gate can only fail on actual secret findings.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so PR base..head and push base^..HEAD always resolve.
          fetch-depth: 0

      - name: Range resolver regression test (guard)
        run: node scripts/scan-range.mjs --selftest

      - name: Fetch PR base + head refs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true

      - name: Resolve scan range (never emits an invalid revision range)
        id: range
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "scan_opts=$(node scripts/scan-range.mjs)" >> "$GITHUB_OUTPUT"
          echo "resolved log-opts: ${{ steps.range.outputs.scan_opts }}"

      - name: Install gitleaks (pinned v8.16.1 with SHA-256)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.16.1/gitleaks_8.16.1_linux_x64.tar.gz"
          echo "b6296a7222b069fbe82e87633c2f2411499dbbe88d3eb7a5a59b7f59650d8082  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p /usr/local/bin
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks scan
        # exit code 2 = findings → the job fails. Range errors cannot occur
        # (resolver falls back to a full-history scan instead).
        run: |
          gitleaks detect --redact --exit-code=2 --config .gitleaks.toml \
            --report-format=sarif --report-path=gitleaks-results.sarif \
            --log-opts="${{ steps.range.outputs.scan_opts }}"

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif