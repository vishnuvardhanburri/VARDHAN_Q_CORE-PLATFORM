# ===================================================================
# VARDHAN Q-CORE — Enterprise Server Production Stack
# ===================================================================
# Designed for deployment on customer-managed VMs, private cloud, or
# bare-metal servers across regulated financial institutions.
#
# Key security attributes:
# - TLS 1.3 termination at edge proxy (Caddy / port 443)
# - Internal microservice ports bound strictly to localhost / container net
# - Unprivileged non-root execution (UID 10001)
# - Memory and CPU quotas enforced on every container
# - Strict JSON log rotation to prevent disk exhaustion
# - PostgreSQL transactional persistence with durable write-ahead logging
# ===================================================================

services:
  control-plane:
    image: vardhan-control-plane:enterprise-${VARDHAN_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: always
    environment:
      VARDHAN_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://vardhan:${POSTGRES_PASSWORD:-vardhan_prod_secure_secret}@postgres:5432/vardhan_control_plane}
      VARDHAN_CONTROL_PLANE_ADDR: 0.0.0.0:8080
      VARDHAN_CONTROL_PLANE_DATA_DIR: /var/lib/vardhan/control-plane
      VARDHAN_KEYSTORE_DIR: /var/lib/vardhan/keystore
      VARDHAN_IDEMPOTENCY_DIR: /var/lib/vardhan/idempotency
      VARDHAN_AUTH_CONFIG_PATH: /var/lib/vardhan/auth_config/auth_config.json
      VARDHAN_NODE_ID: ${VARDHAN_NODE_ID:-node-prod-01}
      VARDHAN_ADMIN_USERNAME: ${VARDHAN_ADMIN_USERNAME:-admin}
      VARDHAN_ADMIN_PASSWORD: ${VARDHAN_ADMIN_PASSWORD}
      VARDHAN_ADMIN_PASSWORD_FILE: ${VARDHAN_ADMIN_PASSWORD_FILE:-}
      VARDHAN_TLS_TERMINATION: ingress
      VARDHAN_ALLOWED_ORIGINS: ${VARDHAN_ALLOWED_ORIGINS:-https://localhost,https://127.0.0.1}
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=32M,mode=1777
    volumes:
      - control-plane-data:/var/lib/vardhan/control-plane
      - keystore-data:/var/lib/vardhan/keystore
      - idempotency-data:/var/lib/vardhan/idempotency
      - auth-config-data:/var/lib/vardhan/auth_config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/platform/health | grep -q operational"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
    networks:
      - vardhan-internal

  intelligence-plane:
    image: vardhan-intelligence:enterprise-${VARDHAN_TAG:-latest}
    build:
      context: .
      dockerfile: intelligence_plane/Dockerfile
      args:
        VITE_API_URL: "https://${VARDHAN_DOMAIN:-localhost}"
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      control-plane:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - vardhan-internal

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vardhan_control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-vardhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vardhan_prod_secure_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vardhan} -d ${POSTGRES_DB:-vardhan_control_plane}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - vardhan-internal

  tls-proxy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "${VARDHAN_HTTPS_PORT:-443}:443"
      - "${VARDHAN_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      control-plane:
        condition: service_healthy
      intelligence-plane:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - vardhan-internal

networks:
  vardhan-internal:
    driver: bridge

volumes:
  control-plane-data:
  keystore-data:
  idempotency-data:
  auth-config-data:
  postgres-data:
  caddy-data:
  caddy-config:
