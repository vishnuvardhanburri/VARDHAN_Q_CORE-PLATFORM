[package]
name = "pq_verify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pq_verify"
path = "src/main.rs"

[dependencies]
audit_ledger = { path = "../audit_ledger" }
core_crypto = { path = "../core_crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
