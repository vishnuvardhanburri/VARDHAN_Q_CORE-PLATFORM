[package]
name = "ha_cluster"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
uuid = { version = "1.26.0", features = ["v4", "fast-rng"] }
core_crypto = { path = "../core_crypto" }
ledger_sync = { path = "../ledger_sync" }
proxy_engine = { path = "../proxy_engine" }
audit_ledger = { path = "../audit_ledger" }
hex = "0.4"
rand = "0.8"
futures = "0.3"
blake3 = "1.5"

[dev-dependencies]
tracing-subscriber = "0.3"
blake3 = "1.5"
aes-gcm = "0.10"
serde_cbor = "0.11"
