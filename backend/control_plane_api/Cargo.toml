[package]
name = "control_plane_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
auth_service = { path = "../auth_service" }
core_crypto = { path = "../core_crypto" }
enterprise_tenant = { path = "../enterprise_tenant" }
saas_metering = { path = "../saas_metering" }
ledger_persistence = { path = "../ledger_persistence" }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
