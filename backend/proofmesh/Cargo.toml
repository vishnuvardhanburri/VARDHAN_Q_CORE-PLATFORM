[package]
name = "proofmesh"
version = "0.1.0"
edition = "2021"

[dependencies]
core_crypto = { path = "../core_crypto" }
tokio = { version = "1.0", features = ["time", "process", "rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
blake3 = "1.5"
hex = "0.4"
vardhan_state = { path = "../vardhan_state" }
async-trait = "0.1.92"
tempfile = "3.27.0"
