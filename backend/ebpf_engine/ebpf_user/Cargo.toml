[package]
name = "vardhan_ebpf_user"
version = "0.1.0"
edition = "2021"
description = "Userspace controller for the Vardhan Q-Core eBPF Shield"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
colored = "2"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12"
aya-log = "0.2"
