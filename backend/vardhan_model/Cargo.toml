[package]
name = "vardhan_model"
version = "0.1.0"
edition = "2021"
description = "Vardhan Quantum — Common Enterprise Model, Event Fabric, and Dependency Graph"
license = "Proprietary — Vardhan Quantum"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

