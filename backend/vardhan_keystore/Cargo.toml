[package]
name = "vardhan_keystore"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
rand = "0.8"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
[dev-dependencies]
tempfile = "3"
