[package]
name = "vardhan_keystore"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
rand = "0.8"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
aes-gcm = "0.11"
zeroize = { version = "1", features = ["zeroize_derive"] }
tracing = "0.1"
thiserror = "2"
# Vault integration (optional, enabled via feature flag)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
vault = ["reqwest", "base64"]

[dev-dependencies]
tempfile = "3"
