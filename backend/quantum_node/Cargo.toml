[package]
name = "quantum_node"
version = "0.1.0"
edition = "2021"

[dependencies]
core_crypto = { path = "../core_crypto" }
proxy_engine = { path = "../proxy_engine" }
ledger_sync = { path = "../ledger_sync" }
ledger_persistence = { path = "../ledger_persistence" }
ha_cluster = { path = "../ha_cluster" }
quantum_network = { path = "../quantum_network" }

tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
toml = "0.8"
