openapi: 3.1.0
info:
  title: Vardhan Technologies Enterprise Control Plane API
  version: 1.0.0
  description: Canonical versioned API contract for Vardhan Technologies. Authentication, authorization and commercial entitlements are server-enforced.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Platform
  - name: Organizations
  - name: Billing
  - name: Usage
paths:
  /platform/health:
    get:
      security: []
      tags: [Platform]
      responses:
        '200': { description: Control-plane health, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /catalog/plans:
    get:
      security: []
      tags: [Billing]
      responses:
        '200': { description: Available commercial plans, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } }
  /billing/webhook:
    post:
      security: []
      tags: [Billing]
      description: Receives a provider-signed billing event. The control plane validates signature, timestamp and event idempotency before persisting verified subscription state.
      parameters:
        - { name: x-vardhan-billing-signature, in: header, required: true, schema: { type: string } }
        - { name: x-vardhan-billing-timestamp, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BillingEvent' } } }
      responses:
        '200': { description: Event accepted or already processed }
        '400': { description: Invalid event }
        '401': { description: Signature or timestamp rejected }
        '503': { description: Billing verification not configured }
  /me:
    get:
      tags: [Platform]
      responses:
        '200': { description: Authenticated principal, content: { application/json: { schema: { type: object, required: [username, authenticated], properties: { username: { type: string }, authenticated: { type: boolean } } } } } }
  /organizations:
    get:
      tags: [Organizations]
      responses:
        '200': { description: Organizations visible to the caller, content: { application/json: { schema: { type: object, properties: { organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } } } }
    post:
      tags: [Organizations]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 2, maxLength: 120 } } } } } }
      responses:
        '201': { description: Organization created, content: { application/json: { schema: { type: object, properties: { organization: { $ref: '#/components/schemas/Organization' }, subscription: { $ref: '#/components/schemas/Subscription' } } } } } }
  /organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      tags: [Organizations]
      responses:
        '200': { description: Organization }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizations/{id}/entitlements:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      tags: [Billing]
      responses:
        '200':
          description: Entitlements resolved only from verified billing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementResponse'
  /organizations/{id}/subscription:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      tags: [Billing]
      responses:
        '200': { description: Subscription state, content: { application/json: { schema: { type: object, properties: { subscription: { $ref: '#/components/schemas/Subscription' } } } } } }
    post:
      tags: [Billing]
      description: Requests a plan change. This never activates paid entitlements; a verified billing event is required.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [plan_id], properties: { plan_id: { type: string } } } } } }
      responses:
        '202': { description: Billing activation pending }
  /organizations/{id}/usage:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      tags: [Usage]
      responses:
        '200': { description: Current usage, content: { application/json: { schema: { type: object, properties: { usage: { $ref: '#/components/schemas/Usage' } } } } } }
  /organizations/{id}/usage/record:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    post:
      tags: [Usage]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bytes_processed, transactions], properties: { bytes_processed: { type: integer, format: int64, minimum: 0 }, transactions: { type: integer, format: int64, minimum: 0 } } } } } }
      responses: { '200': { description: Usage recorded } }
components:
  parameters:
    OrganizationId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: session-token }
  responses:
    Forbidden: { description: Organization access denied }
    NotFound: { description: Resource not found }
  schemas:
    Health:
      type: object
      required: [service, status, mode, authentication, demo_authentication]
      properties:
        service: { type: string }
        status: { type: string }
        mode: { type: string }
        authentication: { type: string }
        demo_authentication: { type: boolean }
    Plan:
      type: object
      required: [id, name, tier, contact_sales, entitlements]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string }
        contact_sales: { type: boolean }
        entitlements: { type: array, items: { type: string } }
    Organization:
      type: object
      required: [id, name, owner, created_at_ms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string }
        created_at_ms: { type: integer, format: int64 }
    Subscription:
      type: object
      required: [organization_id, plan_id, status, provider]
      properties:
        organization_id: { type: string, format: uuid }
        plan_id: { type: string }
        status: { type: string }
        provider: { type: string }
        external_customer_id: { type: [string, 'null'] }
        external_subscription_id: { type: [string, 'null'] }
    EntitlementResponse:
      type: object
      required: [organization_id, subscription_status, entitlements, activation]
      properties:
        organization_id: { type: string, format: uuid }
        plan: { anyOf: [{ $ref: '#/components/schemas/Plan' }, { type: 'null' }] }
        subscription_status: { type: string }
        provider: { type: string }
        entitlements: { type: array, items: { type: string } }
        activation: { type: string, enum: [verified, suspended, requires_verified_billing_event] }
    BillingEvent:
      type: object
      required: [event_id, provider, event_type, organization_id, status, timestamp]
      properties:
        event_id: { type: string }
        provider: { type: string }
        event_type: { type: string }
        organization_id: { type: string, format: uuid }
        plan_id: { type: [string, 'null'] }
        external_customer_id: { type: [string, 'null'] }
        external_subscription_id: { type: [string, 'null'] }
        status: { type: string, enum: [Provisioning, AwaitingBillingActivation, Trialing, Active, PastDue, Suspended, Canceled, Expired] }
        timestamp: { type: integer, format: int64 }
    Usage:
      type: object
      required: [organization_id, transactions, bytes_processed]
      properties:
        organization_id: { type: string, format: uuid }
        transactions: { type: integer, format: int64 }
        bytes_processed: { type: integer, format: int64 }
