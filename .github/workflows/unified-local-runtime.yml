name: Unified Local Runtime Validation

on:
  push:
    branches: ["**"]
    paths:
      - "qcore"
      - "docker-compose.yml"
      - "docker/**"
      - "intelligence_plane/**"
      - "sdks/typescript/vardhan-qcore/**"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/unified-local-runtime.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "qcore"
      - "docker-compose.yml"
      - "docker/**"
      - "intelligence_plane/**"
      - "sdks/typescript/vardhan-qcore/**"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/unified-local-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-runtime:
    name: Build and smoke-test the canonical local stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Record Docker and Compose versions
        run: |
          docker --version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build control-plane and Intelligence Plane images
        run: docker compose --env-file .env.example build --pull control-plane intelligence-plane

      - name: Start complete local stack and wait for health
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 180

      - name: Smoke-test public local endpoints
        run: |
          curl --retry 20 --retry-connrefused --retry-delay 3 --fail --silent --show-error \
            http://127.0.0.1:8080/api/v1/platform/health
          curl --retry 20 --retry-connrefused --retry-delay 3 --fail --silent --show-error \
            http://127.0.0.1:3000/ > /dev/null
          echo "Control-plane health and Intelligence Plane HTTP checks passed."

      - name: Capture service status and failure logs
        if: always()
        run: |
          docker compose --env-file .env.example ps
          docker compose --env-file .env.example logs --no-color --tail=150 || true

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
