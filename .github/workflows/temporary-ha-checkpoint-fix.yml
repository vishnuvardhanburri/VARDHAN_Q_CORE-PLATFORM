name: Temporary HA checkpoint fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Apply exact checkpoint leader fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("backend/ha_cluster/tests/raft_l3_2_checkpoints.rs")
          s = p.read_text()
          old1 = 'let sig = leader_node.identity.sign_payload(&canonical).unwrap();'
          new1 = 'let sig = nodes[leader_idx].identity.sign_payload(&canonical).unwrap();'
          old2 = 'let pub_key = leader_node.identity.dsa_public_key_bytes();'
          new2 = 'let pub_key = nodes[leader_idx].identity.dsa_public_key_bytes();'
          assert s.count(old1) == 1, f"expected one signature reference, found {s.count(old1)}"
          assert s.count(old2) == 1, f"expected one public-key reference, found {s.count(old2)}"
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
      - name: Verify checkpoint test compiles
        run: cargo test -p ha_cluster --test raft_l3_2_checkpoints --no-run
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-ha-checkpoint-fix.yml
          git add backend/ha_cluster/tests/raft_l3_2_checkpoints.rs
          git commit -m "fix: correct checkpoint leader references"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
