name: Supply Chain Security

on:
  push:
    branches: ["main", "phase-p1-p2-completion-20261005"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency and supply-chain verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Rust audit
        run: cargo audit
      - name: Cargo deny advisories
        run: cargo deny check advisories
      - name: Repository secret scan
        run: |
          set -euo pipefail
          if git grep -nIE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' --             ':(exclude).github/workflows/security.yml'             ':(exclude)zk_engine/.gitleaks.toml'             ':(exclude)zk_engine/packages/keys/test/keypair.test.ts'             ':(exclude)zk_engine/packages/keys/test/envelope.test.ts'; then
            echo "Potential credential material detected in tracked repository files." >&2
            exit 1
          fi
