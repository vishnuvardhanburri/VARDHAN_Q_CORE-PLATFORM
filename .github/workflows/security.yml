name: Supply Chain Security (F-013)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny (advisories)
        run: cargo deny check advisories

      - name: Generate SBOM
        run: |
          cargo sbom --output-format cyclone_dx_json_1_5 > bom.json
          echo "SBOM generated with $(wc -l < bom.json) lines"

      - name: Verify SBOM exists
        run: |
          if [ ! -s bom.json ]; then
            echo "FAIL: bom.json not found or empty"
            exit 1
          fi
          echo "PASS: bom.json exists"

      - name: Verify deny.toml exists
        run: |
          test -f deny.toml || { echo "FAIL: deny.toml not found"; exit 1; }
          echo "PASS: deny.toml exists"

      - name: Verify .cargo/audit.toml exists
        run: |
          test -f .cargo/audit.toml || { echo "FAIL: .cargo/audit.toml not found"; exit 1; }
          echo "PASS: .cargo/audit.toml exists"

      - name: Secret scanning (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          redact: true

      - name: Cargo formatting check
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --release
