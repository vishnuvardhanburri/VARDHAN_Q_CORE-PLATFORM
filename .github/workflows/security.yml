name: Supply Chain Security

on:
  push:
    branches: ["main", "phase-p1-p2-completion-20261005"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency and supply-chain verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Rust audit
        run: cargo audit
      - name: Cargo deny advisories
        run: cargo deny check advisories
      - name: Repository secret scan
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          excluded = {
              "zk_engine/.gitleaks.toml",
              "zk_engine/packages/keys/test/keypair.test.ts",
              "zk_engine/packages/keys/test/envelope.test.ts",
          }
          pattern = re.compile(rb"AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----")
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          hits = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8")
              if path in excluded:
                  continue
              try:
                  with open(path, "rb") as handle:
                      if pattern.search(handle.read()):
                          hits.append(path)
              except OSError:
                  continue

          if hits:
              print("Potential repository secret material found:")
              for path in hits:
                  print(f"  {path}")
              sys.exit(1)
          print("No secret-pattern matches found outside approved deterministic fixtures.")
          PY
