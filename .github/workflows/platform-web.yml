name: Platform Web Contract

on:
  push:
    branches: ["main", "phase-p1-p2-completion-20261005"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web-contract:
    name: Authenticated console contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Console contract
        run: node platform_web/test.mjs
      - name: Frontend source sanity
        run: |
          test -f platform_web/index.html
          test -f platform_web/enterprise-console.html
