name: Vardhan Q-Core Enterprise Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-sign:
    name: Build & Cryptographically Sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.4.0

      - name: Install BLAKE3 CLI
        run: cargo install b3sum --locked

      - name: Build Optimized Release Binary
        run: |
          cargo build --release -p vardhan_receipt --target aarch64-unknown-linux-gnu
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/vardhan-receipt

      - name: Generate BLAKE3 Integrity Hash
        id: hash
        run: |
          HASH=$(b3sum target/aarch64-unknown-linux-gnu/release/vardhan-receipt | awk '{print $1}')
          echo "VARDHAN_BINARY_HASH=$HASH" >> "$GITHUB_ENV"
          echo "Binary Hash: $HASH"

      - name: Sign Binary via Sigstore
        run: |
          cosign sign-blob --yes target/aarch64-unknown-linux-gnu/release/vardhan-receipt --bundle vardhan-receipt.bundle

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/aarch64-unknown-linux-gnu/release/vardhan-receipt
            vardhan-receipt.bundle
          body: |
            ## Vardhan Q-Core Enterprise Release
            **Cryptographically signed release artifact**

            - **Target:** `aarch64-unknown-linux-gnu`
            - **BLAKE3 Hash:** `${{ env.VARDHAN_BINARY_HASH }}`
            - **Signing:** Sigstore/Cosign keyless signing

            SLSA provenance is not claimed by this workflow unless a provenance generator and verification step are added.
