[package]
name = "vardhan-sdk"
version = "0.2.0"
edition = "2021"
description = "Official Vardhan Technologies Rust SDK"
license = "UNLICENSED"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
