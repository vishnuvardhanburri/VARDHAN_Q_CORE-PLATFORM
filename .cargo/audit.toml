[advisories]
# F-013: Supply chain advisory allowlist.
# All entries below are explicitly documented with rationale.
ignore = [
    # Legacy rustls 0.21.12 remains only in the opt-in AWS KMS SDK compatibility path.
    # Upstream's 2026 fixes target >=0.23.46 and do not support backporting to 0.21.
    # scripts/check_rustls_lock.py separately fails CI if the active 0.23 line falls below 0.23.46.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    # rustls-pemfile is unmaintained (archived Aug 2025); upstream recommends rustls-pki-types PemObject
    "RUSTSEC-2025-0134",
    # rustls-webpki 0.101.7 transitive via legacy rustls 0.21.12 compatibility path
    "RUSTSEC-2026-0382",
    "RUSTSEC-2021-0127",  # serde_cbor unmaintained — non-production poc_auditor only
    "RUSTSEC-2026-0258",  # h2 unbounded DATA frames — transitive via aws-sdk-kms
    "RUSTSEC-2026-0104",  # rustls-webpki CRL panic — transitive via aws-sdk-kms
    "RUSTSEC-2026-0098",  # rustls-webpki URI name constraints — transitive via aws-sdk-kms
    "RUSTSEC-2026-0099",  # rustls-webpki wildcard constraints — transitive via aws-sdk-kms
    "RUSTSEC-2025-0057",  # fxhash unmaintained — transitive via criterion (test-only)
    "RUSTSEC-2024-0384",  # instant unmaintained — transitive via criterion (test-only)
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via criterion (test-only)
    "RUSTSEC-2026-0163",  # pqcrypto-internals unmaintained (PQClean archived) — ML-DSA-87 signing
    "RUSTSEC-2026-0166",  # pqcrypto-mldsa unmaintained (PQClean archived) — ML-DSA-87 signing
    "RUSTSEC-2026-0162",  # pqcrypto-traits unmaintained (PQClean archived) — ML-DSA-87 signing
    "RUSTSEC-2023-0071",  # rsa Marvin timing advisory — transitive SAML crypto; RSA private-key decryption is disabled
    "RUSTSEC-2026-0187",  # poc_auditor legacy genpdf/LODPF stack — non-production PoC
]
