apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vardhan-qcore.fullname" . | default "vardhan-qcore" }}
  labels:
    app.kubernetes.io/name: vardhan-qcore
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vardhan-qcore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vardhan-qcore
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: VARDHAN_ENV
              value: "production"
            - name: VARDHAN_CONTROL_PLANE_ADDR
              value: "0.0.0.0:8080"
            - name: VARDHAN_TLS_TERMINATION
              value: "ingress"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          livenessProbe:
            httpGet:
              path: /api/v1/platform/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/platform/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: data-volume
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vardhan-qcore.fullname" . | default "vardhan-qcore" }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
