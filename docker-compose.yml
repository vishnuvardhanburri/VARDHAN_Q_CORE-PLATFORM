# ===================================================================
# VARDHAN Q-CORE — Canonical Local Development Runtime
# ===================================================================
# The root ./qcore command is the supported local control surface.
# It uses this Compose file to build and run the API and UI.
#
# Start:   ./qcore up
# Status:  ./qcore status
# Logs:    ./qcore logs
# Stop:    ./qcore down
# PoV:     ./qcore pov
#
# The eBPF shield is Linux-only and privileged, so it is intentionally
# not part of the default development stack.
# ===================================================================

services:
  control-plane:
    image: vardhan-control-plane:dev-${VARDHAN_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: runtime
    ports:
      - "127.0.0.1:${VARDHAN_CONTROL_PLANE_PORT:-8080}:8080"
    environment:
      VARDHAN_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://vardhan:vardhan_secure_db_pass@postgres:5432/vardhan_control_plane}
      VARDHAN_CONTROL_PLANE_ADDR: 0.0.0.0:8080
      VARDHAN_CONTROL_PLANE_DATA_DIR: /var/lib/vardhan/control-plane
      VARDHAN_KEYSTORE_DIR: /var/lib/vardhan/keystore
      VARDHAN_IDEMPOTENCY_DIR: /var/lib/vardhan/idempotency
      VARDHAN_AUTH_CONFIG_PATH: /var/lib/vardhan/auth_config/auth_config.json
      VARDHAN_NODE_ID: control-plane-01
      VARDHAN_ADMIN_USERNAME: ${VARDHAN_ADMIN_USERNAME:-admin}
      VARDHAN_ADMIN_PASSWORD: ${VARDHAN_ADMIN_PASSWORD:-}
      VARDHAN_ADMIN_PASSWORD_FILE: ${VARDHAN_ADMIN_PASSWORD_FILE:-}
      VARDHAN_TLS_TERMINATION: ${VARDHAN_TLS_TERMINATION:-ingress}
      VARDHAN_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://localhost,https://127.0.0.1
    tmpfs:
      - /tmp:size=16M,mode=1777
    volumes:
      - control-plane-data:/var/lib/vardhan/control-plane
      - keystore-data:/var/lib/vardhan/keystore
      - idempotency-data:/var/lib/vardhan/idempotency
      - auth-config-data:/var/lib/vardhan/auth_config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/platform/health | grep -q operational"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - vardhan-net

  intelligence-plane:
    image: vardhan-intelligence:dev-${VARDHAN_TAG:-latest}
    build:
      context: .
      dockerfile: intelligence_plane/Dockerfile
      args:
        VITE_API_URL: "http://localhost:${VARDHAN_CONTROL_PLANE_PORT:-8080}"
    ports:
      - "127.0.0.1:${VARDHAN_INTELLIGENCE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - vardhan-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vardhan_control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-vardhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vardhan_secure_db_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vardhan} -d ${POSTGRES_DB:-vardhan_control_plane}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - vardhan-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  tls-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${VARDHAN_HTTPS_PORT:-443}:443"
      - "${VARDHAN_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - vardhan-net
    depends_on:
      control-plane:
        condition: service_healthy
      intelligence-plane:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

networks:
  vardhan-net:
    driver: bridge

volumes:
  control-plane-data:
  keystore-data:
  idempotency-data:
  auth-config-data:
  postgres-data:
  caddy-data:
  caddy-config:
