# ===================================================================
# VARDHAN Q-CORE — Local Development Runtime
# ===================================================================
# This is the canonical local development stack.
# It starts the control-plane API and the Intelligence Plane frontend.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# For the full PoV benchmark suite, see scripts/qcore-pov/run.sh
#
# The eBPF shield service is Linux-only and privileged; it is in the
# "linux" profile and will not start on macOS by default.
# ===================================================================

services:
  control-plane:
    image: vardhan-control-plane:dev-${VARDHAN_TAG:-latest}
    container_name: vardhan_control_plane
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: runtime
    ports:
      - "${VARDHAN_CONTROL_PLANE_PORT:-8080}:8080"
    environment:
      - VARDHAN_ENV=development
      - VARDHAN_CONTROL_PLANE_ADDR=0.0.0.0:8080
      - VARDHAN_CONTROL_PLANE_DATA_DIR=/var/lib/vardhan/control-plane
      - VARDHAN_KEYSTORE_DIR=/var/lib/vardhan/keystore
      - VARDHAN_IDEMPOTENCY_DIR=/var/lib/vardhan/idempotency
      - VARDHAN_AUTH_CONFIG_PATH=/var/lib/vardhan/auth_config/auth_config.json
      - VARDHAN_NODE_ID=control-plane-01
      - VARDHAN_ADMIN_USERNAME=${VARDHAN_ADMIN_USERNAME:-admin}
      - VARDHAN_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8080
    volumes:
      - control-plane-data:/var/lib/vardhan/control-plane
      - keystore-data:/var/lib/vardhan/keystore
      - idempotency-data:/var/lib/vardhan/idempotency
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/platform/health", "|", "grep", "operational"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  intelligence-plane:
    image: vardhan-intelligence:dev-${VARDHAN_TAG:-latest}
    container_name: vardhan_intelligence_plane
    build:
      context: ./intelligence_plane
      dockerfile: Dockerfile
    ports:
      - "${VARDHAN_INTELLIGENCE_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${VARDHAN_CONTROL_PLANE_PORT:-8080}
    volumes:
      - ./intelligence_plane:/app
      - intelligence-node-modules:/app/node_modules
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  control-plane-data:
  keystore-data:
  idempotency-data:
  intelligence-node-modules:
