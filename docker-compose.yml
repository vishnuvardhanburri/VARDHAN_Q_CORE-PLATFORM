# ===================================================================
# VARDHAN Q-CORE — Canonical Local Development Runtime
# ===================================================================
# The root ./qcore command is the supported local control surface.
# It uses this Compose file to build and run the API and UI.
#
# Start:   ./qcore up
# Status:  ./qcore status
# Logs:    ./qcore logs
# Stop:    ./qcore down
# PoV:     ./qcore pov
#
# The eBPF shield is Linux-only and privileged, so it is intentionally
# not part of the default development stack.
# ===================================================================

services:
  control-plane:
    image: vardhan-control-plane:dev-${VARDHAN_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: runtime
    ports:
      - "${VARDHAN_CONTROL_PLANE_PORT:-8080}:8080"
    environment:
      VARDHAN_ENV: development
      VARDHAN_CONTROL_PLANE_ADDR: 0.0.0.0:8080
      VARDHAN_CONTROL_PLANE_DATA_DIR: /var/lib/vardhan/control-plane
      VARDHAN_KEYSTORE_DIR: /var/lib/vardhan/keystore
      VARDHAN_IDEMPOTENCY_DIR: /var/lib/vardhan/idempotency
      VARDHAN_AUTH_CONFIG_PATH: /var/lib/vardhan/auth_config/auth_config.json
      VARDHAN_NODE_ID: control-plane-01
      VARDHAN_ADMIN_USERNAME: ${VARDHAN_ADMIN_USERNAME:-admin}
      VARDHAN_ADMIN_PASSWORD: ${VARDHAN_ADMIN_PASSWORD:-dev-strong-password-12345}
      VARDHAN_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
    volumes:
      - control-plane-data:/var/lib/vardhan/control-plane
      - keystore-data:/var/lib/vardhan/keystore
      - idempotency-data:/var/lib/vardhan/idempotency
      - auth-config-data:/var/lib/vardhan/auth_config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/platform/health | grep -q operational"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  intelligence-plane:
    image: vardhan-intelligence:dev-${VARDHAN_TAG:-latest}
    build:
      context: .
      dockerfile: intelligence_plane/Dockerfile
      args:
        VITE_API_URL: "http://localhost:${VARDHAN_CONTROL_PLANE_PORT:-8080}"
    ports:
      - "${VARDHAN_INTELLIGENCE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  control-plane-data:
  keystore-data:
  idempotency-data:
  auth-config-data:
